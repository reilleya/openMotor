[build-system]
requires = [
    "setuptools>=84.0.0",
    "Cython>=3.0.11",
    "numpy>=1.24.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "openMotor"
version = "0.6.2"
description = "Internal ballistics simulator for rocket motors"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "docopt>=0.6.2",
    "ezdxf>=1.4.0",
    "imageio>=2.31.0",
    "matplotlib>=3.10",
    "networkx>=3.1",
    "numpy>=1.24.3",
    "Pillow>=9.5.0",
    "platformdirs>=4.2.2",
    "PyQt6>=6.11,<6.12",
    "PyYAML>=6.0",
    "scikit-fmm>=2023.4.2",
    "scikit-image>=0.25,<0.27",
    "scipy>=1.17",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.6",
    "sphinx>=7.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"